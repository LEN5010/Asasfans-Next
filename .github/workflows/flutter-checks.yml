name: Flutter Checks

on:
  pull_request:
  push:
    branches: [master, 'dev/flutter-rebuild', 'codex/**']
  workflow_dispatch:
    inputs:
      build_platforms:
        description: Build unsigned/debug platform artifacts (no publication)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  platform-build:
    if: github.event_name == 'workflow_dispatch' && inputs.build_platforms
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            command: flutter build apk --debug --no-pub
            artifact: build/app/outputs/flutter-apk/app-debug.apk
          - platform: ios
            os: macos-latest
            command: flutter build ios --debug --no-codesign --no-pub
            artifact: build/flutter-ios-debug.tar.gz
          - platform: macos
            os: macos-latest
            command: flutter build macos --debug --no-pub
            artifact: build/flutter-macos-debug.tar.gz
          # Release rather than debug: a debug Windows build needs the Visual
          # C++ debug runtime, which a plain machine does not have, so a tester
          # would just see a missing-DLL error.
          - platform: windows
            os: windows-latest
            command: flutter build windows --release --no-pub
            artifact: build/windows/x64/runner/Release/
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: ${{ matrix.command }}
      - name: Package iOS app preserving bundle permissions
        if: matrix.platform == 'ios'
        run: tar -czf build/flutter-ios-debug.tar.gz -C build/ios/iphoneos Runner.app
      - name: Package macOS app preserving framework symlinks
        if: matrix.platform == 'macos'
        run: tar -czf build/flutter-macos-debug.tar.gz -C build/macos/Build/Products/Debug "Asasfans Next.app"
      - uses: actions/upload-artifact@v4
        with:
          # Windows ships release binaries; the rest stay debug. Nothing here is
          # code-signed, so these are test artifacts, not a distribution.
          name: flutter-${{ matrix.platform }}-${{ matrix.platform == 'windows' && 'release-unsigned' || 'debug' }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
