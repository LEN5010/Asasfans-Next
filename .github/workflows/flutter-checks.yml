name: Flutter Checks

# Run once at final handoff, never automatically during UI implementation.
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the existing full suite only when explicitly requested
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Verify the pinned SDK
        run: ASASFANS_FLUTTER_SDK="$FLUTTER_ROOT" tool/flutterw --verify-sdk
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --no-pub
      - name: Run existing tests only when explicitly requested
        if: inputs.run_tests
        run: flutter test --no-pub
