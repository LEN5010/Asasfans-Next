name: Flutter Checks

on:
  pull_request:
  push:
    branches: [master, 'dev/flutter-rebuild', 'codex/**']
  workflow_dispatch:
    inputs:
      build_platforms:
        description: Build unsigned/debug platform artifacts (no publication)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Verify the pinned SDK
        run: ASASFANS_FLUTTER_SDK="$FLUTTER_ROOT" tool/flutterw --verify-sdk
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  # Installable release artifacts: an APK, a DMG and a Windows setup exe.
  #
  # Android is signed with the original release key, so it can upgrade an
  # installed asasfans.next. macOS is ad-hoc signed, which does not remove the
  # first-launch prompt but does stop macOS reporting the app as damaged.
  # Windows is unsigned and SmartScreen will warn. Those last two are
  # certificate gaps, not something a build flag can close.
  platform-build:
    if: github.event_name == 'workflow_dispatch' && inputs.build_platforms
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            command: flutter build apk --release --no-pub
            artifact: build/app/outputs/flutter-apk/app-release.apk
          - platform: macos
            os: macos-latest
            command: flutter build macos --release --no-pub
            artifact: build/macos/*.dmg
          # Kept building so iOS breakage still shows up, though an unsigned
          # build cannot be installed on a device.
          - platform: ios
            os: macos-latest
            command: flutter build ios --release --no-codesign --no-pub
            artifact: build/flutter-ios-release.tar.gz
          # Keep the existing VS/runner baseline while upgrading Flutter.
          # Moving to windows-latest is a separate, independently verified change.
          - platform: windows
            os: windows-2022
            command: flutter build windows --release --no-pub
            artifact: build/windows/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      # Written to the repository root, which is where the Gradle config
      # resolves a relative storeFile from. The file and the passwords stay in
      # the runner and are never printed.
      - name: Restore the Android release key
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; a release build must not fall back to a debug key." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > asasfans-release.jks
      # Belt and braces on top of the windows-2022 pin: makes the compiler's
      # location explicit rather than relying on the image's default PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'windows'
        with:
          arch: x64
      - name: Install Inno Setup
        if: matrix.platform == 'windows'
        run: choco install innosetup --no-progress
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - name: Verify the pinned SDK (Apple and Android hosts)
        if: matrix.platform != 'windows'
        run: ASASFANS_FLUTTER_SDK="$FLUTTER_ROOT" tool/flutterw --verify-sdk
      - name: Verify the pinned SDK (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:ASASFANS_FLUTTER_SDK = $env:FLUTTER_ROOT
          ./tool/flutterw.ps1 --verify-sdk
      - run: flutter pub get --enforce-lockfile
      # Recorded so the next toolchain failure is readable rather than guessed
      # at from a CMake generator name.
      - name: Report the Windows toolchain
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -products * -format value -property displayName
            & $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -format value -property installationPath
          } else {
            Write-Host "vswhere not present"
          }
          flutter doctor -v
      - name: Build
        env:
          ANDROID_KEYSTORE_FILE: asasfans-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ${{ matrix.command }}
      # The fingerprint is the only evidence that the artifact can upgrade the
      # installed app. It is a public property of a signed APK, not a secret.
      - name: Report the signing certificate
        if: matrix.platform == 'android'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | grep -i 'SHA-256 digest'
      - name: Remove the release key from the runner
        if: always() && matrix.platform == 'android'
        run: rm -f asasfans-release.jks
      # Ad-hoc signed inside the script. No secrets are set here, so it takes
      # the ad-hoc path; wiring Developer ID later is a matter of adding them.
      - name: Package macOS DMG
        if: matrix.platform == 'macos'
        run: bash macos/packaging/build_dmg.sh
      - name: Package Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Split('+')[0].Trim()
          Write-Host "Packaging version $version"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            windows\packaging\installer.iss
      - name: Package iOS app preserving bundle permissions
        if: matrix.platform == 'ios'
        run: tar -czf build/flutter-ios-release.tar.gz -C build/ios/iphoneos Runner.app
      # The name says how much the artifact can be trusted, because that is
      # what decides whether it opens on someone else's machine.
      - uses: actions/upload-artifact@v4
        with:
          name: >-
            asasfans-next-${{ matrix.platform }}-${{
              matrix.platform == 'android' && 'signed' ||
              matrix.platform == 'macos' && 'adhoc-signed' || 'unsigned' }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
