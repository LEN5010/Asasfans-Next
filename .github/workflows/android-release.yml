name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v2.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}
          fetch-depth: 0

      - name: Verify version and release notes
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          build = Path("app/build.gradle").read_text()
          version = re.search(r'versionName\s+"([^"]+)"', build).group(1)
          code = int(re.search(r'versionCode\s+(\d+)', build).group(1))
          if tag != f"v{version}" or code <= 0:
              raise SystemExit("Release tag and Android version do not match")
          notes = Path("release-notes") / f"{version}.md"
          if not notes.is_file() or not notes.read_text().strip():
              raise SystemExit("Release notes are required")
          print(f"Verified {tag}, versionCode {code}")
          PY

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run tests, lint and compile device tests
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebugAndroidTest

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-checks-${{ steps.release_tag.outputs.tag }}
          path: |
            app/build/reports/tests/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Restore signing config
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Missing Android signing secrets." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > asasfans-release.jks
          {
            echo "storeFile=asasfans-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature and prepare artifacts
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          apk="Asasfans-Next-${RELEASE_TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Asasfans-Next-${{ steps.release_tag.outputs.tag }}
          path: |
            Asasfans-Next-${{ steps.release_tag.outputs.tag }}.apk
            Asasfans-Next-${{ steps.release_tag.outputs.tag }}.apk.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          apk="Asasfans-Next-${RELEASE_TAG}.apk"
          notes_file="release-notes/${RELEASE_TAG#v}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk" "$apk.sha256" --clobber
            gh release edit "$RELEASE_TAG" --title "Asasfans Next ${RELEASE_TAG}" --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" "$apk" "$apk.sha256" --verify-tag \
              --title "Asasfans Next ${RELEASE_TAG}" --notes-file "$notes_file"
          fi

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f asasfans-release.jks keystore.properties
